aid: ldap
name: LDAP
description: >-
  LDAP (Lightweight Directory Access Protocol) is an industry-standard
  application protocol for accessing and maintaining distributed directory
  information services over an IP network, formally specified in RFC 4511.
  It plays a critical role in protecting organizational assets and
  maintaining a strong security posture through centralized authentication,
  authorization, and identity management. LDAP underlies directory services
  such as Microsoft Active Directory, OpenLDAP, and 389 Directory Server,
  and is widely used for single sign-on, enterprise address books, and
  application identity stores.
